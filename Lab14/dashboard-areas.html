<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightgray;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: lightyellow;
            padding: 20px;
            min-height: 200px;
        }

        .footer {
            grid-area: footer;
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Dashboard Layout</h1>

    <div class="dashboard">

        <div class="header">
            <h2>Header</h2>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>Dashboard</p>
            <p>Settings</p>
        </div>

        <div class="main">
            <h3>Main Content</h3>
            <p>Welcome to the dashboard.</p>
        </div>

        <div class="footer">
            <p>Footer Section</p>
        </div>

    </div>

</body>
</html>
