<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 12px;

    <div class="card">

        </p>
    </div>

</body>
