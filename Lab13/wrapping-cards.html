<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrapping Flexbox Cards</title>

    <style>
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            width: 180px;
            padding: 20px;
            text-align: center;
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Stationery Shop</h1>

    <div class="row">

        <div class="card">
            <h3>Notebook</h3>
            <p>Price: 60</p>
        </div>

        <div class="card">
            <h3>Pen</h3>
            <p>Price: 15</p>
        </div>

        <div class="card">
            <h3>Bag</h3>
            <p>Price: 350</p>
        </div>

        <div class="card">
            <h3>Book</h3>
            <p>Price: 120</p>
        </div>

    </div>

</body>
</html>
