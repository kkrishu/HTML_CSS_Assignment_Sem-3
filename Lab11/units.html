<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        .pixel-box {
            width: 200px;
            height: 40px;
            background-color: steelblue;
            margin-bottom: 15px;
        }

        .percentage-box {
            width: 50%;
            height: 40px;
            background-color: lightcoral;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>CSS Units Example</h1>

    <h2>200px Wide Box</h2>
    <div class="pixel-box"></div>

    <h2>50% Wide Box</h2>
    <div class="percentage-box"></div>

    <p>This paragraph uses a font size of 1.5rem.</p>

</body>
</html>
